<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <h1>Task Tracker</h1>
    <button id="theme-toggle-btn" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  </div>
  <div id="storage-bar" class="storage-bar"></div>
  <nav id="folder-tabs" class="folder-tabs"></nav>
</header>

<main class="app-main">
  <div class="toolbar">
    <button id="add-category-btn" class="btn btn-secondary">+ Category</button>
    <button id="add-folder-btn" class="btn btn-secondary">+ Folder</button>
    <button id="add-task-btn" class="btn btn-primary">+ Task</button>
  </div>

  <div class="main-layout">
    <div class="main-column">
      <div id="folder-list" class="folder-list"></div>
    </div>
    <aside class="recurring-column">
      <div id="recurring-weekly" class="recurring-box"></div>
      <div id="recurring-daily" class="recurring-box"></div>
    </aside>
  </div>
</main>

<!-- Task add/edit modal -->
<div id="task-modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="task-modal-title">Add Task</h2>
    <form id="task-form">
      <input type="hidden" id="task-id">

      <label>Title
        <input type="text" id="task-title" required>
      </label>

      <label>Notes
        <textarea id="task-notes" rows="3"></textarea>
      </label>

      <label>Folder
        <select id="task-folder" required></select>
      </label>

      <label>Parent task (for nesting)
        <select id="task-parent">
          <option value="">— none (top-level) —</option>
        </select>
      </label>

      <div class="form-row">
        <label>Deadline
          <input type="date" id="task-deadline">
        </label>

        <label>Importance
          <select id="task-importance">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </label>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="task-urgent-flag">
          Manual urgent flag
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" id="task-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Folder add modal -->
<div id="folder-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Add Folder</h2>
    <form id="folder-form">
      <label>Name
        <input type="text" id="folder-name" required>
      </label>
      <label>Category
        <select id="folder-category" required></select>
      </label>
      <div class="modal-actions">
        <button type="button" id="folder-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Category add modal -->
<div id="category-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Add Category</h2>
    <form id="category-form">
      <label>Name
        <input type="text" id="category-name" required>
      </label>
      <div class="modal-actions">
        <button type="button" id="category-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Recurring habit add/edit modal -->
<div id="recurring-modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="recurring-modal-title">Add Habit</h2>
    <form id="recurring-form">
      <input type="hidden" id="recurring-id">

      <label>Title
        <input type="text" id="recurring-title" required>
      </label>

      <label>Folder
        <select id="recurring-folder" required></select>
      </label>

      <div class="form-row">
        <label>Cadence
          <select id="recurring-cadence">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
        </label>

        <label id="recurring-weekday-label">Weekly on
          <select id="recurring-weekday">
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
            <option value="0">Sunday</option>
          </select>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" id="recurring-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Shown when a previously chosen folder needs a click to re-grant access after reload -->
<div id="storage-gate" class="modal hidden">
  <div class="modal-content">
    <h2>Reconnect to your folder</h2>
    <p class="gate-text">Your tasks are stored in <strong id="storage-gate-folder"></strong>. The browser needs you to confirm access again.</p>
    <div class="gate-actions">
      <button type="button" id="gate-reconnect-btn" class="btn btn-primary">Reconnect</button>
      <button type="button" id="gate-choose-btn" class="btn btn-secondary">Choose a different folder</button>
      <button type="button" id="gate-browser-btn" class="btn btn-secondary">Use browser storage instead</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
